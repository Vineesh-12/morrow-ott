<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="urbanGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D2520" />
      <stop offset="50%" stop-color="#1E1917" />
      <stop offset="100%" stop-color="#111315" />
    </radialGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#111315" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#urbanGlow)" />

  <!-- City Skyline Silhouettes -->
  <g fill="#161719" opacity="0.9">
    <!-- Back buildings -->
    <rect x="180" y="240" width="100" height="480" />
    <rect x="310" y="190" width="130" height="530" />
    <polygon points="375,120 375,190 377,190 377,120" stroke="#C87552" stroke-width="2" />
    <rect x="470" y="280" width="140" height="440" />
    <rect x="640" y="210" width="110" height="510" />
    <rect x="780" y="160" width="150" height="560" />
    <polygon points="855,90 855,160 857,160 857,90" stroke="#F2EEE8" stroke-width="2" />
    <rect x="960" y="250" width="120" height="470" />
  </g>

  <!-- Foreground buildings with windows -->
  <g fill="#1F2124">
    <rect x="240" y="320" width="90" height="400" />
    <rect x="360" y="260" width="120" height="460" />
    <rect x="520" y="340" width="100" height="380" />
    <rect x="720" y="270" width="110" height="450" />
    <rect x="880" y="310" width="130" height="410" />
  </g>

  <!-- Window lights in copper and ivory -->
  <g fill="#C87552" opacity="0.6">
    <circle cx="390" cy="300" r="3" />
    <circle cx="420" cy="300" r="3" />
    <circle cx="390" cy="340" r="3" />
    <circle cx="420" cy="340" r="3" />
    <circle cx="750" cy="310" r="3" />
    <circle cx="780" cy="310" r="3" />
    <circle cx="750" cy="350" r="3" />
    <circle cx="780" cy="350" r="3" />
  </g>
  <g fill="#F2EEE8" opacity="0.5">
    <circle cx="405" cy="320" r="3" />
    <circle cx="765" cy="330" r="3" />
    <circle cx="910" cy="340" r="3" />
    <circle cx="940" cy="340" r="3" />
  </g>

  <!-- Vignette -->
  <rect width="1280" height="720" fill="url(#overlay)" />

  <!-- Typography / Info -->
  <rect x="70" y="460" width="140" height="26" rx="4" fill="#C87552" />
  <text x="140" y="478" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F2EEE8" text-anchor="middle" letter-spacing="1.5">CULTURE &amp; ARTS</text>

  <text x="70" y="530" font-family="'Inter', -apple-system, sans-serif" font-size="42" font-weight="700" fill="#F2EEE8" letter-spacing="-0.5">Urban Rhythm</text>
  <text x="70" y="575" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#A8A49E">Architectural Perspectives of the 21st-Century City</text>

  <rect x="70" y="615" width="70" height="24" rx="4" fill="#1C1E20" stroke="#343638" />
  <text x="105" y="632" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#A8A49E" text-anchor="middle">HD 1080p</text>
  <text x="160" y="632" font-family="'Inter', -apple-system, sans-serif" font-size="14" fill="#A8A49E">0:10 • Cinematography Showcase</text>
</svg>
