<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="natureGlow" cx="60%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#213028" />
      <stop offset="55%" stop-color="#161F1B" />
      <stop offset="100%" stop-color="#111315" />
    </radialGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#111315" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#natureGlow)" />

  <!-- Botanical Art Elements -->
  <g transform="translate(720, 140)">
    <!-- Central Flower Petals in subtle organic copper and warm ivory tones -->
    <circle cx="200" cy="200" r="160" fill="#2E4237" opacity="0.4" />
    <circle cx="200" cy="200" r="100" fill="#3D594B" opacity="0.4" />
    <circle cx="200" cy="200" r="40" fill="#C87552" opacity="0.8" />

    <!-- Stylized Petals radiating outward -->
    <path d="M 200,80 Q 230,140 200,200 Q 170,140 200,80" fill="#F2EEE8" opacity="0.3" />
    <path d="M 200,320 Q 230,260 200,200 Q 170,260 200,320" fill="#F2EEE8" opacity="0.3" />
    <path d="M 80,200 Q 140,230 200,200 Q 140,170 80,200" fill="#F2EEE8" opacity="0.3" />
    <path d="M 320,200 Q 260,230 200,200 Q 260,170 320,200" fill="#F2EEE8" opacity="0.3" />

    <!-- Rotated Petals -->
    <path d="M 115,115 Q 165,150 200,200 Q 150,165 115,115" fill="#C87552" opacity="0.5" />
    <path d="M 285,285 Q 235,250 200,200 Q 250,235 285,285" fill="#C87552" opacity="0.5" />
    <path d="M 115,285 Q 165,250 200,200 Q 150,235 115,285" fill="#C87552" opacity="0.5" />
    <path d="M 285,115 Q 235,150 200,200 Q 250,165 285,115" fill="#C87552" opacity="0.5" />

    <!-- Pistil Center -->
    <circle cx="200" cy="200" r="18" fill="#F2EEE8" />
  </g>

  <!-- Vignette -->
  <rect width="1280" height="720" fill="url(#overlay)" />

  <!-- Typography / Info -->
  <rect x="70" y="460" width="160" height="26" rx="4" fill="#C87552" />
  <text x="150" y="478" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F2EEE8" text-anchor="middle" letter-spacing="1.5">NATURE &amp; SCIENCE</text>

  <text x="70" y="530" font-family="'Inter', -apple-system, sans-serif" font-size="42" font-weight="700" fill="#F2EEE8" letter-spacing="-0.5">Botanical Life</text>
  <text x="70" y="575" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#A8A49E">Macro Cinematography and Microscopic Flora</text>

  <rect x="70" y="615" width="70" height="24" rx="4" fill="#1C1E20" stroke="#343638" />
  <text x="105" y="632" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#A8A49E" text-anchor="middle">HD 1080p</text>
  <text x="160" y="632" font-family="'Inter', -apple-system, sans-serif" font-size="14" fill="#A8A49E">0:05 • Open Educational Media</text>
</svg>
